- aid: taskhawktech-com:taskhawktech-com-billing-api
  name: TaskHawk Systems Billing API
  description: >-
    Payment surface discovery for clients before attempting a paid call.


    1. `GET /payment/health` - rail challenge and configuration status.

    2. `GET /payment/quote?endpoint=/path` - per-endpoint price across candidate rails.

    3. For generic paid agents, fetch a safe-method 402 challenge, then POST with a verified rail credential.
    Unpaid executable POST remains Delegation-gated.


    `GET /payment/discovery` aggregates rail status and quotes. `GET /payment/badge` returns a compact
    status badge payload. Discovery is cached and does not represent settlement, adoption, or revenue
    evidence.
  humanURL: https://governance.taskhawktech.com/api
  baseURL: https://governance.taskhawktech.com
