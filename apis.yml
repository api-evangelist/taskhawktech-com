apis:
- aid: taskhawktech-com:kevros-governance-api
  name: Kevros Governance API
  description: REST gateway for runtime enforcement of autonomous agent actions. POST /governance/verify returns
    a signed ALLOW/CONSTRAIN/DENY decision with a release token; /governance/attest appends a hash-chained provenance
    record; /governance/bind and /governance/verify-outcome bind a declared intent to a command and check the outcome;
    /governance/bundle exports a compliance evidence package. Also exposes /shield/scan prompt-injection detection,
    /media/* hash attestation certificates, /governance/mpp/* governed streaming payment sessions, /signup trial
    key provisioning and /payment/* rail discovery. Priced endpoints return HTTP 402 with x402, L402 and MPP challenges.
  image: https://taskhawktech.com/assets/brand/wordmark-light.svg
