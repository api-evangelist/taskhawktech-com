aid: taskhawktech-com
name: TaskHawk Systems
description: 'TaskHawk Systems, LLC (Charlottesville, Virginia) builds operational verification infrastructure for
  autonomous AI and software systems. Its commercial product, Kevros, is a verified release and evidence gateway:
  before an agent spends, deploys, sends or actuates, it POSTs the proposed action to the Kevros Governance API
  and receives a signed ALLOW, CONSTRAIN or DENY decision with a release token, recorded in a hash-chained, post-quantum-signed
  provenance ledger. The gateway at governance.taskhawktech.com publishes an OpenAPI 3.1 contract (23 operations:
  verify, attest, bind, verify-outcome, bundle, prompt-injection shield scan, media hash attestation, MPP payment
  sessions), a hosted Streamable HTTP MCP server with 9 tools, an A2A agent card, RFC 8414 authorization-server
  metadata, and per-call machine payment discovery over x402 (USDC on Base), L402 (Lightning) and MPP (Stripe) rails
  with a 1,000-call trial allowance via POST /signup.'
