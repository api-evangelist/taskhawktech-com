- aid: taskhawktech-com:kevros-mcp-server
  name: Kevros MCP Server
  description: Hosted Streamable HTTP MCP server (protocol 2025-03-26, FastMCP, server version 0.4.1) at https://governance.taskhawktech.com/mcp/
    exposing 9 tools (verify, attest, bind, verify-outcome, bundle, health, status, check-peer, verify-token), 2
    resources and 2 prompts. tools/list, resources/list and prompts/list answer anonymously; paid tools (verify,
    attest, bind, bundle) need an X-API-Key from POST /signup or a verified Delegation proof. Also published as
    an MCP server.json manifest and a /.well-known/mcp.json descriptor, and listed on Smithery.
