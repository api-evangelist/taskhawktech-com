        Designed for two audiences:

        1. AI agents — poll this BEFORE attempting a rail so they do not

        chase a rail that cannot emit the expected challenge metadata.

        2. Operators / oncall — single curl shows configured rail candidates

        without needing to read the gateway''s bootlog.


        By default this endpoint does NO outbound network calls — it only

        reflects local public configuration state. `?deep=true` performs

        operator-only backend probes and requires X-Admin-Key.'
      operationId: getPaymentHealth
      parameters:
      - name: deep
        in: query
        required: false
        schema:
          type: boolean
          description: Probe backend connectivity; requires X-Admin-Key
          default: false
          title: Deep
        description: Probe backend connectivity; requires X-Admin-Key
      - name: X-Admin-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Key
      responses:
        '200':
          description: Per-rail challenge-configuration state with operator-readable failure reasons. Not settlement or revenue evidence.
          content:
            application/json:
              schema: {}
              example:
                status: healthy
                rails_enabled: 3
                rails_total: 5
                rails:
                - rail: x402
                  enabled: true
                  network: base-mainnet
                - rail: l402
                  enabled: true
                  network: lightning
                - rail: mpp
                  enabled: true
                  network: fiat
                version: 0.x.x
                doc: https://governance.taskhawktech.com/.well-known/x402
        '422':
          description: Validation Error
          content:
