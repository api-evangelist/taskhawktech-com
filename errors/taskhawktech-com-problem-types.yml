  meaning: 'On /payment/quote: "Endpoint is not priced (free or unknown)". On media lookups: unknown certificate_id.
    Live 404s are JSON {"detail":"Not Found"}.'
- status: 405
  title: Method Not Allowed
  operations: []
  meaning: Observed on GET /governance/verify-token and GET /oauth/token — POST-only routes that exist outside the
