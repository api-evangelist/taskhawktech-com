problems:
- status: 400
  title: Invalid endpoint parameter
  operations:
  - getPaymentQuote
  meaning: The endpoint query parameter is malformed.
  remediation: Pass a path such as /governance/verify.
- status: 401
  title: Delegation challenge (governed execution)
  operations:
  - verify-action
  - attest-action
  - bind-intent
  - generate-bundle
  - shield-scan
  - mpp-create-session
  meaning: 'Governed/high-authority execution without X-API-Key or Delegation proof. Documented in for-agents.txt
    as HTTP 401 or 403 with WWW-Authenticate: Delegation … nonce, max-age=300, rails="mpp x402 l402". NOT declared
    in the OpenAPI.'
  remediation: 'Retry with Authorization: Delegation <token>, Delegation-Proof: :<cose>:, JSON delegation_proof,
    or an X-API-Key from POST /signup.'
  source: llms/taskhawktech-com-for-agents.txt
- status: 402
  title: Payment Required
  operations:
  - verify-action
  - attest-action
  - bind-intent
  - generate-bundle
  - shield-scan
  - attest_media_media_attest_post
  - mpp-create-session
  meaning: Priced self-serve endpoint called without a rail credential or API key. The body is an RFC 9457 problem
    that also carries every rail challenge. ALLOW, CONSTRAIN and DENY are all paid evaluations — payment buys the
    evaluation, never an ALLOW.
  remediation: 'Either POST /signup for a trial X-API-Key, or pay one advertised, enabled rail (re-fetch /payment/discovery
    first) and retry with Authorization: L402 <macaroon>:<preimage>, PAYMENT-SIGNATURE / X-PAYMENT (x402) or Authorization:
    Payment <credential> (MPP).'
  observed_live: true
- status: 403
  title: Delegation / authority refusal
  operations:
  - approve_media_certificate_media_approve__certificate_id__post
  - revoke_media_certificate_media_revoke__certificate_id__post
  meaning: Media lifecycle mutation requires an X-API-Key bound to the certificate's agent_id or an internal admin
    key; paid rail credentials are explicitly refused (x-authority-info accepts_paid_rail false). Also one of the
    two governed-execution challenge statuses.
  remediation: Use the operator key that issued the certificate. Do not send x402/L402/MPP credentials to lifecycle
    endpoints.
- status: 404
  title: Not Found
  operations:
