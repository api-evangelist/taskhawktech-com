decision_semantics:
  note: 'A DENY is NOT an error: it is a 200 with decision DENY, a reason, a provenance_hash and no release_token.
    Fail-closed means any verification failure yields DENY. enforcement_mode advisory returns the would-be decision
    in advisory_decision without enforcing.'
  decision_enum:
  - ALLOW
  - CONSTRAIN
  - DENY
  wire_alias: CONSTRAIN may appear as the legacy value CLAMP (MCP tool description; PyPI SDK README).
