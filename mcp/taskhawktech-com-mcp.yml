tools:
- name: verify
  title: Verify Action
  description: 'Verify an action against policy bounds before executing it. Returns ALLOW (proceed), CONSTRAIN (proceed
    with modified values; emitted on the wire as the legacy value CLAMP - both refer to the same verdict, CONSTRAIN
    is the public name), or DENY (stop). Every verification is recorded in a hash-chained provenance ledger. Cost:
    $0.01 per call.'
  required_inputs:
  - action_type
  - action_payload
  - agent_id
  inputs:
  - action_type
  - action_payload
  - agent_id
  - policy_context
  - template_id
  - idempotency_key
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
- name: attest
  title: Attest Action
  description: 'Create a hash-chained provenance record for an action you''ve taken. Each attestation extends the
    append-only evidence chain. The hash can be independently verified by any third party. Cost: $0.02 per call.'
  required_inputs:
  - agent_id
  - action_description
  - action_payload
  inputs:
  - agent_id
  - action_description
  - action_payload
  - context
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: false
- name: bind
  title: Bind Intent to Command
  description: 'Declare an intent and cryptographically bind it to a command. Proves that the command was issued
    in service of the declared intent. Use verify-outcome after execution to close the loop. Cost: $0.02 per call.'
  required_inputs:
  - agent_id
  - intent_type
  - intent_description
  - command_payload
  inputs:
  - agent_id
  - intent_type
  - intent_description
  - command_payload
  - goal_state
  - intent_source
  - parent_intent_id
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: false
- name: verify-outcome
  title: Verify Outcome
  description: 'Verify that an executed action achieved its declared intent. Closes the loop: intent -> command
    -> action -> outcome -> verification. Free (included with bind).'
  required_inputs:
  - agent_id
  - intent_id
  - binding_id
  - actual_state
  inputs:
  - agent_id
  - intent_id
  - binding_id
  - actual_state
  - tolerance
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
- name: bundle
  title: Generate Compliance Bundle
  description: 'Generate a certifier-grade compliance evidence bundle. Contains hash-chained provenance, intent
    bindings, PQC attestations, and verification instructions. Independently verifiable without Kevros access. Cost:
    $0.05 per call.'
  required_inputs:
  - agent_id
  inputs:
  - agent_id
  - time_range_start
  - time_range_end
  - max_records
  - include_intent_chains
  - include_pqc_signatures
  - include_verification_instructions
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
