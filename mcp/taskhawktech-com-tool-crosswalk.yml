divergences:
- The MCP verify tool description says CONSTRAIN is emitted on the wire as the legacy value CLAMP; the OpenAPI Decision
  enum is [ALLOW, CONSTRAIN, DENY] and the PyPI SDK README says ALLOW/CLAMP/DENY — three surfaces, two spellings
  of one verdict.
- MCP tool verify exposes idempotency_key and annotates idempotentHint true; attest and bind annotate idempotentHint
  false although their REST schemas carry a cmd_id replay-protection field.
- The MCP server exposes no media, shield, signup or payment-discovery tools; an agent using only MCP cannot reach
  18 of the 23 REST operations.
